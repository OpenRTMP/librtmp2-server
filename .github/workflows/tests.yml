name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: cargo build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Check formatting
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --locked --all-targets --features test-support -- -D warnings

    # The Docker image ships with the cluster feature, so its code is linted too.
    - name: Clippy (cluster)
      run: cargo clippy --locked --all-targets --features test-support,cluster -- -D warnings

    - name: Build
      run: cargo build --locked --verbose

    - name: Run tests
      run: cargo test --verbose --features test-support -- --test-threads=1

    - name: Run cluster tests
      run: cargo test --lib --verbose --features cluster,test-support -- --test-threads=1

    - name: Run E2E integration tests
      run: cargo test --verbose --features test-support --test rtmp_http_e2e -- --test-threads=1

  docker-smoke:
    name: docker build (amd64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Build Docker image
      run: docker build --platform linux/amd64 -t librtmp2-server:ci .
