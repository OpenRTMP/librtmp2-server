name: Release

# Builds and packages tagged releases. Push a tag like `v0.1.0` to produce
# a prebuilt binary tarball and a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # Decide what gets built: an existing tag is built from its own commit, a new
  # tag from the dispatched commit (and created there when the release is
  # published). The tag must match the crate version in that commit.
  resolve:
    name: resolve release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      tag: ${{ steps.ref.outputs.tag }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag, commit and version
        id: ref
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$REF' must look like v<major>.<minor>.<patch>"
            exit 1
          fi
          if SHA="$(git rev-parse -q --verify "refs/tags/$REF^{commit}")"; then
            echo "Tag $REF exists at $SHA; building that commit"
          else
            SHA="$GITHUB_SHA"
            echo "Tag $REF does not exist yet; building $SHA"
          fi
          VERSION="${REF#v}"
          CRATE_VERSION="$(git show "$SHA:Cargo.toml" | awk -F '"' '/^version = "/ { print $2; exit }')"
          if [ "$VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Release tag $REF does not match the crate version $CRATE_VERSION in Cargo.toml at $SHA"
            exit 1
          fi
          {
            echo "sha=$SHA"
            echo "tag=$REF"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: verify before release
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (release)
        run: cargo build --locked --release

      - name: Run tests
        run: cargo test --locked --release

  package:
    name: build & package
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Resolve version
        id: ver
        run: |
          echo "version=${{ needs.resolve.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ needs.resolve.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --locked --release

      - name: Stage install tree
        run: |
          DIST="dist/librtmp2-server-${{ steps.ver.outputs.version }}"
          mkdir -p "$DIST"
          test -f target/release/librtmp2-server
          test -f .env.example
          cp target/release/librtmp2-server "$DIST/"
          cp .env.example "$DIST/.env"
          cp README.md LICENSE "$DIST/"

      - name: Create binary tarball
        run: |
          cd dist
          tar czf "librtmp2-server-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" \
            "librtmp2-server-${{ steps.ver.outputs.version }}"
          sha256sum "librtmp2-server-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" \
            > "librtmp2-server-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz.sha256"

      - name: Create source tarball
        run: |
          git archive --format=tar.gz \
            --prefix="librtmp2-server-${{ steps.ver.outputs.version }}/" \
            -o "dist/librtmp2-server-${{ steps.ver.outputs.version }}-src.tar.gz" HEAD
          cd dist
          sha256sum "librtmp2-server-${{ steps.ver.outputs.version }}-src.tar.gz" \
            > "librtmp2-server-${{ steps.ver.outputs.version }}-src.tar.gz.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: librtmp2-server-${{ steps.ver.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # Create a missing tag at the commit that was built, not at the
          # default branch's head (which can move while the release builds).
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: librtmp2-server ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  docker:
    name: build & push docker image
    needs: [resolve, package]
    uses: ./.github/workflows/docker-multiarch.yml
    permissions:
      packages: write
      contents: read
    secrets: inherit
    with:
      version: ${{ needs.package.outputs.version }}
      ref: ${{ needs.resolve.outputs.sha }}

  # Benchmarks run after the release exists and are attached to it afterwards;
  # the Docker image above does not wait for them.
  benchmarks:
    name: benchmarks
    needs: package
    uses: ./.github/workflows/benchmarks.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: write
