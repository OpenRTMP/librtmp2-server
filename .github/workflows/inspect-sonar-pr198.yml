name: Inspect Sonar PR 198

on:
  push:
    branches:
      - feature/media-outputs

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch Sonar findings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=OpenRTMP_librtmp2-server' \
            --data-urlencode 'pullRequest=198' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'sinceLeakPeriod=true' \
            -o /tmp/sonar.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/sonar.json'))
          print('TOTAL', data.get('total'))
          for issue in data.get('issues', []):
              print('ISSUE')
              print('key:', issue.get('key'))
              print('rule:', issue.get('rule'))
              print('severity:', issue.get('severity'))
              print('type:', issue.get('type'))
              print('component:', issue.get('component'))
              print('line:', issue.get('line'))
              print('message:', issue.get('message'))
          PY
