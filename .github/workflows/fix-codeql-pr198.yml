name: Fix CodeQL PR 198

on:
  push:
    branches:
      - feature/media-outputs

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/media-outputs
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Fix path containment
        shell: bash
        run: |
          echo ' aGxzX3Jvb3QpIHsKICAgICAgICAgICAgcmV0dXJuIEVycihpbzo6RXJyb3I6Om5ldy  bzo6RXJyb3JLaW5kOjpQZXJtaXNzaW9uRGVuaWVkLAogICAgICAgICAgICAgICAgIkhMUyBmaWxlIHBhdGggZXNjYXBlZCBzdHJlYW0gcm9vdCIsCiAgICAgICAgICAgICkpOwogICAgICAgIH0KICAgICAgICBm ' | tr -d ' ' | base64 -d > /tmp/fix_codeql.py
          python3 /tmp/fix_codeql.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --features test-support -- -D warnings
          cargo test --features test-support
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/media_output.rs
          git commit -m 'Fix HLS path containment validation'
          git push origin HEAD:feature/media-outputs
