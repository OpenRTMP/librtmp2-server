name: SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-llvm-cov

      - name: Read crate version
        id: crate_version
        run: echo "version=$(awk -F'\"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Generate test coverage
        run: |
          # Match Tests workflow: lib tests plus integration test binaries.
          # cargo-llvm-cov 0.7+ merges profiles via --no-report, not --append.
          cargo llvm-cov --features test-support,cluster --no-report -- --test-threads=1
          cargo llvm-cov --features test-support,cluster --no-report --test rtmp_http_e2e -- --test-threads=1
          cargo llvm-cov --features test-support,cluster --no-report --test cluster_ha -- --test-threads=1
          cargo llvm-cov --features test-support,cluster --no-report --test cluster_snapshot -- --test-threads=1
          cargo llvm-cov --features test-support,cluster --no-report --test cluster_security -- --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: -Dsonar.projectVersion=${{ steps.crate_version.outputs.version }}
