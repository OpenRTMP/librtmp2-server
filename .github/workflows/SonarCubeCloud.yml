name: SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7ba3421b00d46a29aaedcfe59124f4574e23e73e # cargo-llvm-cov

      - name: Read crate version
        id: crate_version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate test coverage
        run: |
          # Match Tests workflow: lib tests plus integration test binaries.
          # cargo-llvm-cov 0.7+ merges profiles via --no-report, not --append.
          cargo llvm-cov --features test-support,cluster --no-report -- --test-threads=1
          cargo llvm-cov --features test-support,cluster --no-report --test rtmp_http_e2e -- --test-threads=1
          cargo llvm-cov --features test-support,cluster --no-report --test cluster_ha -- --test-threads=1
          cargo llvm-cov --features test-support,cluster --no-report --test cluster_security -- --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: -Dsonar.projectVersion=${{ steps.crate_version.outputs.version }}
