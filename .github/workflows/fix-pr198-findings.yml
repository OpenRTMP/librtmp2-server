name: Fix PR 198 findings

on:
  push:
    branches:
      - feature/media-outputs

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/media-outputs
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/media_output.rs')
          text = path.read_text()

          text = text.replace(
              'use std::time::{Duration, SystemTime, UNIX_EPOCH};',
              'use std::time::{Duration, Instant, SystemTime, UNIX_EPOCH};',
          )

          old = '''pub struct MediaOutputManager {
    config: MediaOutputConfig,
    db: Arc<Db>,
    sessions: HashMap<u64, MediaSession>,
}'''
          new = '''pub struct MediaOutputManager {
    config: MediaOutputConfig,
    db: Arc<Db>,
    sessions: HashMap<u64, MediaSession>,
    failed_sessions: HashSet<u64>,
}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        Self {
            config,
            db,
            sessions: HashMap::new(),
        }'''
          new = '''        Self {
            config,
            db,
            sessions: HashMap::new(),
            failed_sessions: HashSet::new(),
        }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        if !self.config.enabled() || stream_id.is_empty() {
            return;
        }
        if self
            .sessions'''
          new = '''        if !self.config.enabled() || stream_id.is_empty() {
            return;
        }
        if self.failed_sessions.contains(&conn_id) {
            return;
        }
        if self
            .sessions'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            Err(e) => {
                crate::log_error!("Media outputs: failed to start stream '{}': {e}", stream.id)
            }'''
          new = '''            Err(e) => {
                self.failed_sessions.insert(conn_id);
                crate::log_error!(
                    "Media outputs: failed to start stream '{}': {e}; retries disabled for conn={conn_id}",
                    stream.id
                );
            }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        for id in stale {
            if let Some(session) = self.sessions.remove(&id) {
                session.stop(&self.config);
            }
        }
    }

    pub fn stop_all(&mut self) {
        let sessions = std::mem::take(&mut self.sessions);'''
          new = '''        for id in stale {
            if let Some(session) = self.sessions.remove(&id) {
                session.stop(&self.config);
            }
        }
        self.failed_sessions.retain(|id| live.contains(id));
    }

    pub fn stop_all(&mut self) {
        self.failed_sessions.clear();
        let sessions = std::mem::take(&mut self.sessions);'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    fn stop(mut self, config: &MediaOutputConfig) {
        self.sinks.clear();
        if let Some(mut child) = self.publish_exec.take() {'''
          new = '''    fn stop(mut self, config: &MediaOutputConfig) {
        let sinks = std::mem::take(&mut self.sinks);
        for sink in sinks {
            sink.stop();
        }
        if let Some(mut child) = self.publish_exec.take() {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''struct SinkSender {
    label: String,
    tx: Option<mpsc::SyncSender<Arc<Vec<u8>>>>,
    queued_bytes: Arc<AtomicUsize>,
    max_bytes: usize,
    failed: Arc<AtomicBool>,
}'''
          new = '''struct SinkSender {
    label: String,
    tx: Option<mpsc::SyncSender<Arc<Vec<u8>>>>,
    queued_bytes: Arc<AtomicUsize>,
    max_bytes: usize,
    failed: Arc<AtomicBool>,
    worker: Option<thread::JoinHandle<()>>,
}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    fn disable(&mut self, reason: &str) {
        if !self.failed.swap(true, Ordering::AcqRel) {
            crate::log_warn!("Media output '{}' disabled: {reason}", self.label);
        }
        self.tx = None;
    }
}'''
          new = '''    fn disable(&mut self, reason: &str) {
        if !self.failed.swap(true, Ordering::AcqRel) {
            crate::log_warn!("Media output '{}' disabled: {reason}", self.label);
        }
        self.tx = None;
    }

    fn stop(mut self) {
        self.tx = None;
        let Some(worker) = self.worker.take() else {
            return;
        };
        let deadline = Instant::now() + Duration::from_secs(5);
        while !worker.is_finished() && Instant::now() < deadline {
            thread::sleep(Duration::from_millis(10));
        }
        if worker.is_finished() {
            if worker.join().is_err() {
                crate::log_warn!("Media output '{}' worker panicked during shutdown", self.label);
            }
        } else {
            crate::log_warn!(
                "Media output '{}' worker did not stop within 5s; continuing shutdown",
                self.label
            );
        }
    }
}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    if thread::Builder::new()
        .name(thread_name)
        .spawn(move || worker(rx, worker_bytes, worker_failed))
        .is_err()
    {
        failed.store(true, Ordering::Relaxed);
    }
    SinkSender {
        label,
        tx: Some(tx),
        queued_bytes,
        max_bytes,
        failed,
    }'''
          new = '''    let worker = match thread::Builder::new()
        .name(thread_name)
        .spawn(move || worker(rx, worker_bytes, worker_failed))
    {
        Ok(handle) => Some(handle),
        Err(e) => {
            failed.store(true, Ordering::Relaxed);
            crate::log_error!("Failed to start media output worker '{label}': {e}");
            None
        }
    };
    SinkSender {
        label,
        tx: Some(tx),
        queued_bytes,
        max_bytes,
        failed,
        worker,
    }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    loop {
        let Some(rel) = out[search_from..].find("URI=\\\"") else {
            break;
        };
        let start = search_from + rel + 5;'''
          new = '''    while let Some(rel) = out[search_from..].find("URI=\\\"") {
        let start = search_from + rel + 5;'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)

          path = Path('src/server.rs')
          text = path.read_text()
          old = '''        let mut app = http::router(state);
        if media_output_config.hls_enabled {
            app = app.merge(crate::media_output::hls_router(
                media_output_config.hls_path.clone(),
                Arc::clone(&self.db),
                media_output_config.hls_require_key,
            ));'''
          new = '''        let mut app = http::router(Arc::clone(&state));
        if media_output_config.hls_enabled {
            let hls_limiter = crate::rate_limit::RateLimiter::new(
                self.config.http_rate_limit_config(),
                self.config.http_trusted_proxies.clone(),
                Arc::clone(&state.api_token),
            );
            let hls_app = crate::media_output::hls_router(
                media_output_config.hls_path.clone(),
                Arc::clone(&self.db),
                media_output_config.hls_require_key,
            )
            .layer(axum::middleware::from_fn_with_state(
                hls_limiter,
                crate::rate_limit::middleware,
            ));
            app = app.merge(hls_app);'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --all-targets --features test-support -- -D warnings
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/media_output.rs src/server.rs
          git commit -m 'Fix media output CI and review findings'
          git push origin HEAD:feature/media-outputs
