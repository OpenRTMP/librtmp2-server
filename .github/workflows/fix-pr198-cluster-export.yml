name: Apply PR 198 cluster export fix

on:
  push:
    branches:
      - feature/media-outputs
    paths:
      - .github/fix_pr198_cluster_export.py
      - .github/workflows/fix-pr198-cluster-export.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/media-outputs
          fetch-depth: 0

      - name: Apply fix
        run: python3 .github/fix_pr198_cluster_export.py

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --all-targets --features test-support -- -D warnings

      - name: Test
        run: cargo test --features test-support

      - name: Commit source fix and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/fix_pr198_cluster_export.py
          git rm -f .github/workflows/fix-pr198-cluster-export.yml
          git add -A
          git commit -m "fix(cluster): drop ambiguous republish export frames"
          git push origin HEAD:feature/media-outputs
