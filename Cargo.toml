[package]
name = "librtmp2-server"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "RTMP / E-RTMP media server built on librtmp2"

[lib]
name = "librtmp2_server"
path = "src/lib.rs"

[[bin]]
name = "librtmp2-server"
path = "src/main.rs"

[dependencies]
# Pin to librtmp2 0.7.0 commit (relay export/inject). Switch to crates.io
# `version = "0.7.0"` once published. Local sibling override:
#   [patch."https://github.com/OpenRTMP/librtmp2"]
#   librtmp2 = { path = "../librtmp2" }
librtmp2 = { git = "https://github.com/OpenRTMP/librtmp2", rev = "bb756ba07a8092f5a75c52b4f7f8e78116a4e425", features = ["tls"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"

# Optional HA clustering (OpenRaft). Off by default; enable with `--features cluster`.
openraft = { version = "=0.9.25", optional = true, features = ["serde", "storage-v2"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
uuid = { version = "1", optional = true, features = ["v4"] }
x509-parser = { version = "0.18", optional = true }

[features]
default = []
test-support = []
cluster = [
    "dep:openraft",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:futures",
    "dep:bytes",
    "dep:tracing",
    "dep:sha2",
    "dep:hex",
    "dep:uuid",
    "dep:x509-parser",
]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking", "query"] }
serial_test = "4"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "http_api"
harness = false
required-features = ["test-support"]

[[test]]
name = "rtmp_http_e2e"
path = "tests/rtmp_http_e2e.rs"
required-features = ["test-support"]

[[test]]
name = "cluster_ha"
path = "tests/cluster_ha.rs"
required-features = ["cluster", "test-support"]

[[test]]
name = "cluster_security"
path = "tests/cluster_security.rs"
required-features = ["cluster"]

[profile.release]
opt-level = 3
