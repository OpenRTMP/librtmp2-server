sonar.projectKey=OpenRTMP_librtmp2-server
sonar.organization=openrtmp
sonar.rust.lcov.reportPaths=lcov.info
# Orchestration (src/server.rs) and media workers (src/media_output.rs) are exercised
# through in-process integration tests and docker suites; llvm-cov does not attribute
# most of that runtime coverage back to these files on the main-branch leak period.
sonar.coverage.exclusions=src/server.rs,src/media_output.rs
